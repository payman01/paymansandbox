# Docs for the Azure Web Apps Deploy action: <https://github.com/azure/functions-action>
# More GitHub Actions for Azure: <https://github.com/Azure/actions>
# More info on Python, GitHub Actions, and Azure Functions: <https://aka.ms/python-webapps-actions>
 
name: Build and deploy Python project to Azure Function App - func-inactive-users-2509101550
 
on:
  push:
    branches:
      - main
      - master
      - codegen-bot/azure-inactive-users-function-1757105029
  workflow_dispatch:
 
env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'azure-inactive-users-function' # ← Fixed: Point to function folder
  PYTHON_VERSION: '3.9'
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
 
      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
 
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
 
      # Optional: Add step to run tests here
 
      - name: Zip artifact for deployment
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          zip -r ../release.zip . -x "*.git*" "*.vscode*" "__pycache__*" "*.pyc" "venv/*"
 
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip
 
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
 
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
 
      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_48E5CFC6D29444E08C61248CE9D5C5F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0AFD085CFD64407993D62B23B1BB134B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C313CA66EACC4F3C8616DDD368781556 }}
 
      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'func-inactive-users-2509101550'
          slot-name: 'Production'
          package: '.'  # ← Fixed: Deploy from current directory after unzip